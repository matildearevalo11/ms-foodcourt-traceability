spring:
  application:
    name: ms-foodcourt-traceability
  profiles:
    default: local

server:
  port: ${SERVER_PORT:8083}
  servlet:
    context-path: /api/v1
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    url: /openapi.yaml
    path: /swagger-ui.html
  api-docs:
    enabled: false

aws:
  region: ${AWS_REGION:us-east-2}
  dynamodb:
    table-name: ${DYNAMODB_TABLE_NAME:foodcourt-traceability}

internal:
  api-key: ${TRACEABILITY_API_KEY:1234567890abcde}

jwt:
  secret: ${JWT_SECRET:0123456789abcdef0123456789abcdef}
